<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>

  <title>NexusFlow</title>
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
  <link
    rel="stylesheet"
    as="style"
    onload="this.rel='stylesheet'"
    href="https://fonts.googleapis.com/css2?display=swap&amp;family=Be+Vietnam+Pro%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
  />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    body {
      font-family: "Be Vietnam Pro", "Noto Sans", sans-serif;
      background-color: #121416;
      color: white;
    }
    .icon-button {
      transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
    }
    .icon-button:hover {
      background-color: #2c3135;
    }
    .select-button {
      transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
    }
    .select-button:hover {
      background-color: #4299e1;
    }
    .select-button:active {
      transform: scale(0.98);
    }
    .search-input {
      border-color: #2c3135;
      background-color: #1e2124;
      color: #1e2124;
    }
    .search-input:focus {
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
    }
    .curved-rectangle {
      border-radius: 16px;
    }
  </style>
</head>
<body class="antialiased">
  <div class="relative flex size-full min-h-screen flex-col bg-[#121416] dark justify-between group/design-root overflow-x-hidden">
    <div>

        </div>

      </div>
      <div class="pt-14"></div>
      <main class="container mx-auto max-w-md p-4">
        <section class="mb-8 p-6 bg-[#1e2124] border-2 border-dashed border-[#2c3135] rounded-lg text-center">
          <h2 class="text-lg font-semibold text-white mb-2">To Start Design</h2>
          <p class="text-[#9cabba] mb-4">Drag and Drop here</p>
          <p class="text-[#9cabba] mb-4">or</p>
          <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 px-6 rounded-lg shadow-sm">
            Select Image

        </section>
        <section class="mb-8 p-6 bg-[#1e2124] border-2 border-dashed border-[#2c3135] rounded-lg text-center flex flex-col items-center">
  <h2 class="text-lg font-semibold text-white mb-2">Import from Google Drive</h2>
  <p class="text-[#9cabba] mb-4">Select files directly from your Google Drive</p>
  <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 px-6 rounded-lg shadow-sm flex items-center justify-center gap-2">
    <img src="images/google-drive-logo.png" alt="Google Drive Logo" class="w-8 h-8"/>
    Import from Drive
  </button>
</section>
        <section>

              Search

          </div>
          <div id="imageResults" class="grid grid-cols-2 gap-4 hidden">
            <div class="bg-[#1e2124] p-3 rounded-lg shadow-sm border border-[#2c3135]">

                <span class="material-icons-outlined text-[#9cabba] text-4xl">image</span>
              </div>
              <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 w-full rounded-lg shadow-sm">

            <div class="bg-[#1e2124] p-3 rounded-lg shadow-sm border border-[#2c3135]">
              <div class="bg-[#2c3135] h-32 w-full rounded-md mb-3 flex items-center justify-center">

              </div>
              <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 w-full rounded-lg shadow-sm">

                <span class="material-icons-outlined text-[#9cabba] text-4xl">image</span>
              </div>
              <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 w-full rounded-lg shadow-sm">

            </div>
            <div class="bg-[#1e2124] p-3 rounded-lg shadow-sm border border-[#2c3135]">
              <div class="bg-[#2c3135] h-32 w-full rounded-md mb-3 flex items-center justify-center">
                <span class="material-icons-outlined text-[#9cabba] text-4xl">image</span>
              </div>
              <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 w-full rounded-lg shadow-sm">

            </div>
            <div class="bg-[#1e2124] p-3 rounded-lg shadow-sm border border-[#2c3135]">
              <div class="bg-[#2c3135] h-32 w-full rounded-md mb-3 flex items-center justify-center">
                <span class="material-icons-outlined text-[#9cabba] text-4xl">image</span>
              </div>
              <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 w-full rounded-lg shadow-sm">
                Select

            </div>
            <div class="bg-[#1e2124] p-3 rounded-lg shadow-sm border border-[#2c3135]">
              <div class="bg-[#2c3135] h-32 w-full rounded-md mb-3 flex items-center justify-center">
                <span class="material-icons-outlined text-[#9cabba] text-4xl">image</span>
              </div>
              <button class="select-button bg-[#dce8f3] text-[#121416] font-semibold py-2 w-full rounded-lg shadow-sm">
                Select
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="pb-16"></div>
    <div class="flex gap-2 border-t border-[#283139] bg-[#1b2127] px-4 pb-3 pt-2 fixed bottom-0 left-0 right-0 z-10 curved-rectangle">

              </svg>

      <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#9cabba]" href="post_gallery.html">

            ></path>
          </svg>
        </div>
        <p class="text-[#9cabba] text-xs font-medium leading-normal tracking-[0.015em]">Gallery</p>

      <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#9cabba]" href="profile.html">

              d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"
            ></path>
          </svg>
        </div>
        <p class="text-[#9cabba] text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
      </a>
    </div>
  </div>

  <script>
    // Show image results only after search
    document.getElementById('searchButton').addEventListener('click', function() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput.value.trim() !== '') {
        document.getElementById('imageResults').classList.remove('hidden');
      }
    });
    
    // Also trigger search on Enter key
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        if (this.value.trim() !== '') {
          document.getElementById('imageResults').classList.remove('hidden');
        }
      }
    });
  </script>
</body>
</html>
